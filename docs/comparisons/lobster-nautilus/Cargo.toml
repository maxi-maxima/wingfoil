# Standalone: deliberately NOT a member of the root workspace (see the root
# Cargo.toml `exclude`). It depends on NautilusTrader, which is LGPL-3.0 where
# this repository is Apache-2.0, and pins a different toolchain — neither of
# which should reach the wingfoil build graph or Cargo.lock.
[package]
name = "lobster-nautilus"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
nautilus-model    = "0.61"
nautilus-common   = "0.61"
nautilus-backtest = "0.61"
nautilus-core     = "0.61"
anyhow = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
